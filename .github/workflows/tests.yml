# Сборка и все тесты на чистых системах GitHub: при каждом изменении в main,
# в запросах на слияние и по кнопке «Run workflow».
name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@v7

      # Сверка формата версии 2 с независимой реализацией (tests\interop.js) требует Argon2
      # из Node.js 24.7 и новее, а в образах Windows Server стоит более старая версия.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Сборка
        shell: cmd
        run: call build.cmd

      - name: Тесты
        shell: cmd
        run: call tests\run-tests.cmd

      # Снимки окон помогают понять, что пошло не так.
      - name: Снимки окон (если тесты не прошли)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.os }}
          path: tests/out/ui/**/*.png
          if-no-files-found: ignore
          retention-days: 7
